name: Test and Release

on:
  push:
    branches:
      - "main"
    tags:
      # normal versions
      - "v[0-9]+.[0-9]+.[0-9]+"
      # pre-releases
      - "v[0-9]+.[0-9]+.[0-9]+-**"
  pull_request: {}

# Cancel previous PR/branch runs when a new commit is pushed
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  # libgpiod 2.x is not packaged for ubuntu-latest, so build it once and share it.
  build-libgpiod:
    if: contains(github.event.head_commit.message, '[skip ci]') == false
    runs-on: ubuntu-latest
    steps:
      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential autoconf automake libtool pkg-config autoconf-archive
      - name: Build libgpiod 2.x
        run: |
          wget https://mirrors.edge.kernel.org/pub/software/libs/libgpiod/libgpiod-2.2.1.tar.xz
          tar -xvf libgpiod-2.2.1.tar.xz
          cd libgpiod-2.2.1
          CFLAGS="-fPIC" CXXFLAGS="-fPIC" ./configure --prefix=/usr/local --enable-tools --enable-bindings-cxx
          make -j$(nproc)
          sudo make install
          sudo ldconfig
      - name: Upload libgpiod artifact
        uses: actions/upload-artifact@v7
        with:
          name: libgpiod-2.2.x
          path: |
            /usr/local/include/gpiod.h
            /usr/local/include/gpiod.hpp
            /usr/local/include/gpiodcxx
            /usr/local/include/gpiod/*.h
            /usr/local/lib/libgpiod*.so*
            /usr/local/lib/libgpiod*.a
            /usr/local/lib/libgpiodcxx*.so*
            /usr/local/lib/libgpiodcxx*.a

  test:
    if: contains(github.event.head_commit.message, '[skip ci]') == false
    runs-on: ubuntu-latest
    needs: [build-libgpiod]
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - name: Download libgpiod
        uses: actions/download-artifact@v8
        with:
          name: libgpiod-2.2.x
          path: libgpiod
      - name: Install libgpiod into system
        run: |
          sudo cp -r libgpiod/include/* /usr/local/include/
          sudo cp -r libgpiod/lib/* /usr/local/lib/
          sudo ldconfig
      # This also compiles the native addon through node-gyp, so a broken cpp/ fails here.
      - run: npm install
      - run: npm run lint
      - run: npm test
      # dist/ is committed because consumers install straight from git, so it must not drift.
      # The tsbuildinfo files are caches and differ between runs, so they are excluded.
      - name: Verify that the committed dist/ matches src/
        if: matrix.node-version == '24.x'
        run: |
          npm run build:ts
          git diff --exit-code -- dist ':(exclude)dist/**/*.tsbuildinfo' || {
            echo "::error::dist/ is out of date - run 'npm run build:ts' and commit the result."
            exit 1
          }

  # Publishes the package to npm and creates the matching GitHub release
  deploy:
    needs: [test]

    # Trigger this step only when a commit on any branch is tagged with a version number
    if: |
      contains(github.event.head_commit.message, '[skip ci]') == false &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    # Write permissions are required to create GitHub releases
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
      - name: Determine version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Extract release notes from the changelog
        run: |
          awk -v ver="${{ steps.version.outputs.version }}" '
            $0 ~ "^## " ver "( |$|\\()" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          # Fall back to the tag name if the changelog has no matching section
          [ -s release-notes.md ] || echo "Release ${GITHUB_REF_NAME}" > release-notes.md
          cat release-notes.md
      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md
